name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract
        run: choco install tesseract -y

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pymupdf

      - name: Download translation model
        shell: pwsh
        run: |
          python download_model.py

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name MarathiTranslator `
            --collect-all onnxruntime `
            --collect-all transformers `
            --collect-all tokenizers `
            --collect-all sentencepiece `
            --collect-all IndicTransToolkit `
            app.py

      - name: Include model and OCR resources
        shell: pwsh
        run: |
          if (Test-Path "models") {
            Copy-Item "models" "dist/MarathiTranslator/models" -Recurse -Force
          }

          if (Test-Path "tesseract") {
            Copy-Item "tesseract" "dist/MarathiTranslator/tesseract" -Recurse -Force
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MarathiTranslator-Windows
          path: dist/MarathiTranslator/
          if-no-files-found: error